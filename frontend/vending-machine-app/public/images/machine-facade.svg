<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" width="480" height="760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Retro vending machine cabinet">
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B23A2C"/>
      <stop offset="0.14" stop-color="#E2543F"/>
      <stop offset="0.55" stop-color="#D64B36"/>
      <stop offset="0.92" stop-color="#A83326"/>
      <stop offset="1" stop-color="#8E2A20"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8D9296"/>
      <stop offset="0.25" stop-color="#EFF2F4"/>
      <stop offset="0.5" stop-color="#C3C8CC"/>
      <stop offset="0.75" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#878C90"/>
    </linearGradient>
    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B94E"/>
      <stop offset="1" stop-color="#DFA134"/>
    </linearGradient>
  </defs>

  <rect width="480" height="760" fill="url(#cabinet)"/>

  <!-- chrome side rails -->
  <rect x="0" y="0" width="18" height="760" fill="url(#chrome)" opacity="0.85"/>
  <rect x="462" y="0" width="18" height="760" fill="url(#chrome)" opacity="0.85"/>

  <!-- header marquee -->
  <rect x="26" y="18" width="428" height="74" rx="8" fill="url(#topfade)" stroke="#7A5713" stroke-width="3"/>
  <rect x="34" y="26" width="412" height="58" rx="5" fill="none" stroke="#FFF3D2" stroke-width="2" opacity="0.7"/>

  <!-- atomic starbursts on the marquee -->
  <g stroke="#B23A2C" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M62 40 v-14 M62 66 v-14 M48 46 h-14 M90 46 h-14 M52 36 l-9 -9 M81 55 l9 9 M81 36 l9 -9 M52 55 l-9 9"/>
    <path d="M418 40 v-14 M418 66 v-14 M404 46 h-14 M446 46 h-14 M408 36 l-9 -9 M437 55 l9 9 M437 36 l9 -9 M408 55 l-9 9"/>
  </g>

  <!-- boomerang motifs down the flanks -->
  <g fill="none" stroke="#F6EDDA" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <path d="M40 150 q22 16 6 40 q-16 24 8 40"/>
    <path d="M440 150 q-22 16 -6 40 q16 24 -8 40"/>
    <path d="M40 420 q22 16 6 40 q-16 24 8 40"/>
    <path d="M440 420 q-22 16 -6 40 q16 24 -8 40"/>
  </g>

  <!-- chrome trim band under the marquee -->
  <rect x="26" y="102" width="428" height="10" rx="5" fill="url(#chrome)"/>

  <!-- lower chrome kick plate + coin return hint -->
  <rect x="26" y="676" width="428" height="12" rx="6" fill="url(#chrome)"/>
  <rect x="150" y="706" width="180" height="34" rx="6" fill="#2B2B2E" opacity="0.65" stroke="#8D9296" stroke-width="2"/>

  <!-- soft vignette so overlaid UI stays legible -->
  <rect width="480" height="760" fill="#2B2B2E" opacity="0.06"/>
</svg>

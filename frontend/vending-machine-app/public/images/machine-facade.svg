<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 880" width="780" height="880" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Retro vending machine cabinet">
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B23A2C"/>
      <stop offset="0.12" stop-color="#E2543F"/>
      <stop offset="0.55" stop-color="#D64B36"/>
      <stop offset="0.93" stop-color="#A83326"/>
      <stop offset="1" stop-color="#8E2A20"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8D9296"/>
      <stop offset="0.25" stop-color="#EFF2F4"/>
      <stop offset="0.5" stop-color="#C3C8CC"/>
      <stop offset="0.75" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#878C90"/>
    </linearGradient>
    <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C561"/>
      <stop offset="1" stop-color="#DFA134"/>
    </linearGradient>
  </defs>

  <rect width="780" height="880" fill="url(#cabinet)"/>

  <!-- chrome side rails -->
  <rect x="0" y="0" width="22" height="880" fill="url(#chrome)" opacity="0.85"/>
  <rect x="758" y="0" width="22" height="880" fill="url(#chrome)" opacity="0.85"/>

  <!-- header marquee, sized so the title sits inside it -->
  <rect x="34" y="16" width="712" height="80" rx="9" fill="url(#topfade)" stroke="#7A5713" stroke-width="3"/>
  <rect x="42" y="24" width="696" height="64" rx="6" fill="none" stroke="#FFF3D2" stroke-width="2" opacity="0.7"/>

  <!-- atomic starbursts flanking the title -->
  <g stroke="#B23A2C" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M96 56 v-18 M96 74 v-18 M78 56 h-18 M114 56 h-18 M84 44 l-11 -11 M108 68 l11 11 M108 44 l11 -11 M84 68 l-11 11"/>
    <path d="M684 56 v-18 M684 74 v-18 M666 56 h-18 M702 56 h-18 M672 44 l-11 -11 M696 68 l11 11 M696 44 l11 -11 M672 68 l-11 11"/>
  </g>

  <!-- chrome trim band under the marquee -->
  <rect x="34" y="104" width="712" height="10" rx="5" fill="url(#chrome)"/>

  <!-- boomerang motifs down the flanks, beside the product window -->
  <g fill="none" stroke="#F6EDDA" stroke-width="4" stroke-linecap="round" opacity="0.3">
    <path d="M14 220 q20 18 5 42 q-15 24 7 42"/>
    <path d="M766 220 q-20 18 -5 42 q15 24 -7 42"/>
    <path d="M14 520 q20 18 5 42 q-15 24 7 42"/>
    <path d="M766 520 q-20 18 -5 42 q15 24 -7 42"/>
  </g>

  <!-- lower chrome kick plate + coin return -->
  <rect x="34" y="806" width="712" height="12" rx="6" fill="url(#chrome)"/>
  <rect x="300" y="836" width="180" height="30" rx="6" fill="#2B2B2E" opacity="0.6" stroke="#8D9296" stroke-width="2"/>

  <!-- soft vignette so overlaid UI stays legible -->
  <rect width="780" height="880" fill="#2B2B2E" opacity="0.06"/>
</svg>

<div class="bin">
  <div class="bin__well">
    <!-- Tracking by id recreates the img on every vend, which restarts the drop animation. -->
    @for (dispensed of current() ? [current()!] : []; track dispensed.id) {
      <img
        class="bin__item"
        [src]="imageFor(dispensed.product)"
        [alt]="dispensed.product.name + ' dispensed'"
      />
    }
  </div>

  <div class="bin__mouth">
    <div class="bin__flap" [class.bin__flap--open]="flapOpen()">
      <span class="bin__flap-label">PUSH</span>
    </div>
  </div>
</div>

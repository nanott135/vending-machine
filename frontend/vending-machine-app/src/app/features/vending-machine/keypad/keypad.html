<div class="keypad">
  <div class="keypad__display">{{ entry() || '--' }}</div>

  <div class="keypad__buttons">
    @for (row of rows; track row) {
      <button type="button" (click)="press(row)">{{ row }}</button>
    }
    @for (column of columns; track column) {
      <button type="button" (click)="press(column)">{{ column }}</button>
    }
  </div>

  <div class="keypad__actions">
    <button type="button" (click)="clear()">Clear</button>
    <button type="button" (click)="submit()" [disabled]="entry().length !== 2">Select</button>
  </div>
</div>
